<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrollMark – Export / import</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1><img src="icons/icon-48.png" alt="" width="32" height="32">ScrollMark</h1>
  <p class="count"><span id="count">0</span> saved positions</p>

  <section>
    <h2>Export</h2>
    <p>Download all saved positions as a JSON file.</p>
    <button id="export" class="primary">Export bookmarks</button>
  </section>

  <section>
    <h2>Import</h2>
    <p>Add positions from a ScrollMark export. Existing ones are kept.</p>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <button id="import" class="primary">Import bookmarks…</button>
  </section>

  <div id="status" role="status"></div>
</main>
<script src="options.js"></script>
</body>
</html>
